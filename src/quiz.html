<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试评估 - English Vocab Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, '微软雅黑';
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .setup-panel {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }

        .setup-panel.show {
            display: block;
        }

        .setup-panel h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .setup-group {
            margin-bottom: 20px;
        }

        .setup-group label {
            display: block;
            color: #666;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .setup-group select,
        .setup-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .setup-group input:checked + label::before {
            content: '✓';
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
        }

        .checkbox-item input {
            width: auto;
            margin-right: 10px;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: opacity 0.3s;
            display: inline-block;
            margin-top: 20px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .quiz-panel {
            display: none;
        }

        .quiz-panel.show {
            display: block;
        }

        .progress {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #ddd;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .question-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .question-info {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .options {
            display: grid;
            gap: 15px;
        }

        .option {
            padding: 15px 20px;
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .option.disabled {
            cursor: not-allowed;
        }

        .answer-feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .answer-feedback.show {
            display: block;
        }

        .feedback-correct {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .feedback-incorrect {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        .results {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            display: none;
        }

        .results.show {
            display: block;
        }

        .results h2 {
            font-size: 2em;
            color: #333;
            margin-bottom: 20px;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
            color: white;
            font-size: 3em;
            font-weight: bold;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-item {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
        }

        .stat-label {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .question-card {
                padding: 20px;
            }

            .result-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="location.href='index.html'">← 返回</button>

    <div class="container">
        <header>
            <h1>✏️ 测试评估</h1>
            <p style="color: white; opacity: 0.9;">检测你的学习成果</p>
        </header>

        <!-- 设置面板 -->
        <div class="setup-panel show" id="setupPanel">
            <h2>测试设置</h2>
            
            <div class="setup-group">
                <label>选择等级：</label>
                <select id="levelSelect">
                    <option value="Junior-1">初一</option>
                    <option value="Junior-2">初二</option>
                    <option value="Junior-3">初三</option>
                    <option value="Senior-1">高一</option>
                    <option value="Senior-2">高二</option>
                    <option value="Senior-3">高三</option>
                </select>
            </div>

            <div class="setup-group">
                <label>题目数量：</label>
                <input type="number" id="questionCount" min="5" max="50" value="10">
            </div>

            <div class="setup-group">
                <label>选择题型：</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="multipleChoice" checked>
                        <label for="multipleChoice">选择题</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="fillBlank" checked>
                        <label for="fillBlank">填空题</label>
                    </div>
                </div>
            </div>

            <button class="btn" onclick="startQuiz()">开始测试</button>
        </div>

        <!-- 测试面板 -->
        <div class="quiz-panel" id="quizPanel">
            <div class="progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
                <div style="text-align: center; color: #666;"><span id="currentQuestion">1</span> / <span id="totalQuestions">10</span></div>
            </div>

            <div class="question-card">
                <div class="question-info" id="questionType">多选题</div>
                <div class="question-text" id="questionText">What is the meaning of "house"?</div>
                <div class="options" id="optionsContainer"></div>
                <div class="answer-feedback" id="feedback"></div>
                <div style="margin-top: 20px;">
                    <button class="btn" onclick="nextQuestion()" id="nextBtn" style="display: none;">下一题</button>
                </div>
            </div>
        </div>

        <!-- 结果面板 -->
        <div class="results" id="resultsPanel">
            <h2>测试完成！</h2>
            <div class="score-circle" id="scoreCircle">100%</div>
            <div class="result-stats">
                <div class="stat-item">
                    <div class="stat-label">正确题数</div>
                    <div class="stat-value" id="correctCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">错误题数</div>
                    <div class="stat-value" id="incorrectCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">正确率</div>
                    <div class="stat-value" id="accuracy">0%</div>
                </div>
            </div>
            <button class="btn" onclick="location.href='quiz.html'">再测一次</button>
            <button class="btn" onclick="location.href='index.html'">返回主页</button>
        </div>
    </div>

    <script>
        let vocabData = [];
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        async function loadData() {
            try {
                const response = await fetch('../data/vocab.json');
                vocabData = await response.json();
            } catch (error) {
                vocabData = [
                    { id: 1, word: "house", meaning: "房子", example: "I live in a house.", level: "Junior-1" },
                    { id: 2, word: "school", meaning: "学校", example: "I go to school.", level: "Junior-1" }
                ];
            }
        }

        function startQuiz() {
            const level = document.getElementById('levelSelect').value;
            const count = parseInt(document.getElementById('questionCount').value);
            
            const levelData = vocabData.filter(item => item.level === level);
            if (levelData.length === 0) {
                alert('该等级没有单词');
                return;
            }

            // 随机选择题目
            currentQuestions = [];
            const shuffled = [...levelData].sort(() => Math.random() - 0.5);
            for (let i = 0; i < Math.min(count, shuffled.length); i++) {
                currentQuestions.push(shuffled[i]);
            }

            currentIndex = 0;
            score = 0;
            answered = false;

            document.getElementById('setupPanel').classList.remove('show');
            document.getElementById('quizPanel').classList.add('show');
            document.getElementById('totalQuestions').textContent = currentQuestions.length;
            
            showQuestion();
        }

        function showQuestion() {
            const question = currentQuestions[currentIndex];
            const questionType = Math.random() > 0.5 ? 'multiple' : 'fill';
            
            document.getElementById('currentQuestion').textContent = currentIndex + 1;
            document.getElementById('questionType').textContent = questionType === 'multiple' ? '多选题' : '填空题';
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            answered = false;

            if (questionType === 'multiple') {
                document.getElementById('questionText').textContent = `"${question.word}" 的中文意思是什么？`;
                
                // 生成选项
                const options = [question.meaning];
                const otherWords = currentQuestions.filter(q => q.id !== question.id).sort(() => Math.random() - 0.5).slice(0, 3);
                otherWords.forEach(q => options.push(q.meaning));
                const shuffledOptions = options.sort(() => Math.random() - 0.5);
                
                shuffledOptions.forEach((option, index) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'option';
                    optionDiv.textContent = option;
                    optionDiv.onclick = () => checkAnswer(option === question.meaning, optionDiv);
                    optionsContainer.appendChild(optionDiv);
                });
            }
            
            document.getElementById('feedback').classList.remove('show');
            document.getElementById('nextBtn').style.display = 'none';
        }

        function checkAnswer(isCorrect, element) {
            if (answered) return;
            answered = true;

            const feedback = document.getElementById('feedback');
            const question = currentQuestions[currentIndex];

            if (isCorrect) {
                score++;
                element.classList.add('correct');
                feedback.className = 'answer-feedback show feedback-correct';
                feedback.textContent = '✓ 正确！';
            } else {
                element.classList.add('incorrect');
                feedback.className = 'answer-feedback show feedback-incorrect';
                feedback.textContent = `✗ 错误！正确答案是：${question.meaning}`;
            }

            // 禁用所有选项
            document.querySelectorAll('.option').forEach(option => {
                option.classList.add('disabled');
                if (option.textContent === question.meaning) {
                    option.classList.add('correct');
                }
            });

            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function nextQuestion() {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                showQuestion();
                updateProgress();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            const percentage = Math.round(((currentIndex + 1) / currentQuestions.length) * 100);
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressFill').textContent = percentage + '%';
        }

        function showResults() {
            const total = currentQuestions.length;
            const accuracy = Math.round((score / total) * 100);

            document.getElementById('quizPanel').classList.remove('show');
            document.getElementById('resultsPanel').classList.add('show');
            document.getElementById('scoreCircle').textContent = accuracy + '%';
            document.getElementById('correctCount').textContent = score;
            document.getElementById('incorrectCount').textContent = total - score;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        loadData();
    </script>
</body>
</html>
