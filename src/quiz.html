<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测验模式 Quiz | English Vocab Hub</title>
  <meta name="description" content="多题型英语词汇测验，即时反馈与错题分析">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: rgba(255,255,255,0.05);
      --surface-hover: rgba(255,255,255,0.09);
      --border: rgba(255,255,255,0.10);
      --text: #e8eaf0;
      --text-muted: #8892a4;
      --purple: #7c6df0;
      --blue: #4f9cf9;
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #f87171;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(79,156,249,0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(124,109,240,0.10) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* NAV */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: rgba(10,14,26,0.9);
      backdrop-filter: blur(12px); z-index: 100;
    }
    .nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; font-weight: 700; font-size: 0.95rem; }
    .nav-logo-icon { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg,#7c6df0,#4f9cf9); display:flex;align-items:center;justify-content:center;font-size:0.9rem; }
    .nav-links { display: flex; gap: 6px; }
    .nav-link { padding:7px 14px;border-radius:8px;color:var(--text-muted);text-decoration:none;font-size:0.85rem;font-weight:500;transition:all 0.2s;border:1px solid transparent; }
    .nav-link:hover { color:var(--text);background:var(--surface); }
    .nav-link.active { color:#a78bfa;background:rgba(124,109,240,0.12);border-color:rgba(124,109,240,0.3); }

    /* CONTAINER */
    .main { flex:1; max-width: 700px; margin: 0 auto; width: 100%; padding: 32px 24px 48px; position: relative; z-index: 1; }

    /* SETUP SCREEN */
    #setup-screen { }

    .setup-title {
      text-align: center;
      margin-bottom: 32px;
    }

    .setup-title h1 {
      font-size: 1.9rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .setup-title p { color: var(--text-muted); font-size: 0.9rem; }

    .setup-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 16px;
    }

    .setup-card h3 { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }

    .setup-row { display: flex; gap: 10px; flex-wrap: wrap; }

    .setup-chip {
      padding: 8px 18px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.83rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .setup-chip:hover { border-color: var(--purple); color: var(--text); }
    .setup-chip.active { background: rgba(124,109,240,0.2); border-color: rgba(124,109,240,0.5); color: #a78bfa; }

    .setup-range {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .setup-range input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      outline: none;
    }

    .setup-range input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--purple);
      cursor: pointer;
    }

    .range-val {
      font-weight: 700;
      font-size: 1.1rem;
      color: #a78bfa;
      min-width: 40px;
      text-align: right;
    }

    .start-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #7c6df0, #4f9cf9);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 20px;
      letter-spacing: 0.3px;
    }

    .start-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    /* QUIZ SCREEN */
    #quiz-screen { display: none; }

    /* HUD */
    .quiz-hud {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .hud-progress { flex: 1; }

    .hud-bar {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .hud-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c6df0, #4f9cf9);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .hud-text { font-size: 0.75rem; color: var(--text-muted); }

    .hud-score {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .hud-score-val { color: var(--emerald); }

    /* Timer */
    .timer-ring {
      width: 44px;
      height: 44px;
      position: relative;
      flex-shrink: 0;
    }

    .timer-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
    .timer-ring circle { fill: none; stroke-width: 3; }
    .timer-track { stroke: rgba(255,255,255,0.08); }
    .timer-fill { stroke: var(--purple); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .timer-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: #a78bfa; }

    /* QUESTION CARD */
    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 20px;
    }

    .q-type-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 4px;
      background: rgba(79,156,249,0.15);
      color: var(--blue);
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    .q-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .q-word-big {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .q-phonetic { font-size: 0.95rem; color: var(--text-muted); font-style: italic; margin-bottom: 4px; }
    .q-pos { font-size: 0.8rem; color: #a78bfa; }

    /* OPTIONS */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-btn {
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      line-height: 1.4;
    }

    .option-btn:hover:not([disabled]) { background: var(--surface-hover); border-color: rgba(124,109,240,0.4); }
    .option-btn.correct { background: rgba(52,211,153,0.15); border-color: rgba(52,211,153,0.5); color: var(--emerald); }
    .option-btn.wrong { background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.4); color: var(--rose); }
    .option-btn[disabled] { cursor: default; }

    .option-label { font-size: 0.7rem; font-weight: 700; margin-right: 6px; opacity: 0.6; }

    /* FILL INPUT */
    .fill-input-wrap { position: relative; margin-bottom: 16px; }
    .fill-input {
      width: 100%;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
      letter-spacing: 1px;
    }
    .fill-input:focus { border-color: var(--purple); }
    .fill-input.correct { border-color: var(--emerald); background: rgba(52,211,153,0.08); }
    .fill-input.wrong { border-color: var(--rose); background: rgba(248,113,113,0.08); }

    .fill-submit {
      margin-top: 10px;
      padding: 12px 28px;
      background: linear-gradient(135deg, rgba(124,109,240,0.3), rgba(79,156,249,0.3));
      border: 1px solid rgba(124,109,240,0.4);
      border-radius: 10px;
      color: #a78bfa;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .fill-submit:hover { background: linear-gradient(135deg, rgba(124,109,240,0.5), rgba(79,156,249,0.5)); }

    /* FEEDBACK */
    .feedback-box {
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .feedback-box.correct-fb { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); }
    .feedback-box.wrong-fb { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.3); }
    .fb-title { font-weight: 700; margin-bottom: 6px; }
    .feedback-box.correct-fb .fb-title { color: var(--emerald); }
    .feedback-box.wrong-fb .fb-title { color: var(--rose); }
    .fb-example { font-size: 0.85rem; color: var(--text-muted); font-style: italic; }

    .next-q-btn {
      width: 100%;
      padding: 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .next-q-btn:hover { background: var(--surface-hover); }

    /* RESULT SCREEN */
    #result-screen { display: none; text-align: center; }

    .result-hero { margin-bottom: 32px; }

    .result-grade {
      font-size: 4rem;
      margin-bottom: 12px;
    }

    .result-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .result-score-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: conic-gradient(var(--emerald) var(--pct), rgba(255,255,255,0.08) 0);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      position: relative;
    }

    .result-score-ring::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--bg);
    }

    .result-score-inner {
      position: relative;
      z-index: 1;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--emerald);
    }

    .result-stats {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .result-stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 100px;
    }

    .result-stat-val { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
    .result-stat-lbl { font-size: 0.78rem; color: var(--text-muted); }
    .val-correct { color: var(--emerald); }
    .val-wrong { color: var(--rose); }
    .val-total { color: #a78bfa; }

    /* Wrong list */
    .wrong-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      text-align: left;
    }

    .wrong-list h3 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .wrong-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }

    .wrong-item:last-child { border-bottom: none; }
    .wrong-word { font-weight: 700; color: var(--rose); min-width: 100px; }
    .wrong-right { color: var(--emerald); }
    .wrong-your { color: var(--text-muted); text-decoration: line-through; }

    .result-actions { display: flex; gap: 12px; justify-content: center; }

    .btn-retry {
      padding: 12px 28px;
      background: linear-gradient(135deg, #7c6df0, #4f9cf9);
      border: none;
      border-radius: 10px;
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-retry:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-home {
      padding: 12px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .btn-home:hover { background: var(--surface-hover); }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">📚</div>
    English Vocab Hub
  </a>
  <div class="nav-links" style="align-items:center">
    <a href="index.html" class="nav-link">首页 Home</a>
    <a href="flashcard.html" class="nav-link">闪卡 Flashcards</a>
    <a href="quiz.html" class="nav-link active">测验 Quiz</a>
    <label style="display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:0.82rem;margin-left:8px">
      🔈
      <select id="speed-select" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:5px 8px;font-size:0.82rem;cursor:pointer">
        <option value="0.5">0.5x</option>
        <option value="0.6">0.6x</option>
        <option value="0.75">0.75x</option>
        <option value="0.9">0.9x</option>
        <option value="1">1.0x</option>
      </select>
    </label>
  </div>
</nav>

<div class="main">

  <!-- SETUP SCREEN -->
  <div id="setup-screen">
    <div class="setup-title">
      <h1>✏️ 测验模式 Quiz</h1>
      <p>自定义测验设置，检验你的词汇掌握程度</p>
    </div>

    <div class="setup-card">
      <h3>选择年级 Select Grade</h3>
      <div class="setup-row" id="grade-chips">
        <button class="setup-chip active" data-val="all">全部 All</button>
        <button class="setup-chip" data-val="Primary">小学 Pri</button>
        <button class="setup-chip" data-val="Junior-1">初一 J1</button>
        <button class="setup-chip" data-val="Junior-2">初二 J2</button>
        <button class="setup-chip" data-val="Junior-3">初三 J3</button>
        <button class="setup-chip" data-val="Senior-1">高一 S1</button>
        <button class="setup-chip" data-val="Senior-2">高二 S2</button>
        <button class="setup-chip" data-val="Senior-3">高三 S3</button>
        <button class="setup-chip" data-val="CET-4">四级 C4</button>
        <button class="setup-chip" data-val="CET-6">六级 C6</button>
      </div>
    </div>

    <div class="setup-card">
      <h3>题型 Question Types</h3>
      <div class="setup-row" id="type-chips">
        <button class="setup-chip active" data-val="mc-zh">看英选中</button>
        <button class="setup-chip active" data-val="mc-en">看中选英</button>
        <button class="setup-chip active" data-val="fill">拼写填空</button>
      </div>
    </div>

    <div class="setup-card">
      <h3>题目数量 Number of Questions</h3>
      <div class="setup-range">
        <input type="range" id="q-count" min="5" max="50" value="20" step="5">
        <span class="range-val" id="q-count-val">20</span>
      </div>
    </div>

    <div class="setup-card">
      <h3>计时模式 Timer</h3>
      <div class="setup-row" id="timer-chips">
        <button class="setup-chip active" data-val="0">不计时 No Timer</button>
        <button class="setup-chip" data-val="15">15秒/题</button>
        <button class="setup-chip" data-val="30">30秒/题</button>
        <button class="setup-chip" data-val="60">60秒/题</button>
      </div>
    </div>

    <button class="start-btn" id="start-btn">🚀 开始测验 Start Quiz</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen">
    <div class="quiz-hud">
      <div class="hud-progress">
        <div class="hud-bar"><div class="hud-fill" id="hud-fill"></div></div>
        <span class="hud-text" id="hud-text">0 / 0</span>
      </div>
      <div class="hud-score">
        ✅ <span class="hud-score-val" id="hud-score">0</span> / <span id="hud-total">0</span>
      </div>
      <div class="timer-ring" id="timer-ring" style="display:none">
        <svg viewBox="0 0 44 44">
          <circle class="timer-track" cx="22" cy="22" r="19"/>
          <circle class="timer-fill" id="timer-arc" cx="22" cy="22" r="19"
            stroke-dasharray="119.4" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-text" id="timer-text">—</div>
      </div>
    </div>

    <div class="question-card" id="question-card">
      <div class="q-type-badge" id="q-type-badge">MCQ</div>
      <div id="q-content"><!-- injected --></div>
    </div>

    <div class="feedback-box" id="feedback-box">
      <div class="fb-title" id="fb-title"></div>
      <div class="fb-example" id="fb-example"></div>
    </div>

    <button class="next-q-btn" id="next-q-btn" style="display:none" onclick="nextQuestion()">
      下一题 Next →
    </button>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen">
    <div class="result-hero">
      <div class="result-grade" id="result-grade">🎉</div>
      <div class="result-title" id="result-title">Quiz Complete!</div>
    </div>

    <div class="result-score-ring" id="score-ring">
      <div class="result-score-inner" id="result-pct">0%</div>
    </div>

    <div class="result-stats">
      <div class="result-stat"><div class="result-stat-val val-correct" id="r-correct">0</div><div class="result-stat-lbl">✅ 正确 Correct</div></div>
      <div class="result-stat"><div class="result-stat-val val-wrong" id="r-wrong">0</div><div class="result-stat-lbl">❌ 错误 Wrong</div></div>
      <div class="result-stat"><div class="result-stat-val val-total" id="r-total">0</div><div class="result-stat-lbl">📝 总题数 Total</div></div>
    </div>

    <div class="wrong-list" id="wrong-list" style="display:none">
      <h3>❌ 错题回顾 Wrong Answers</h3>
      <div id="wrong-items"></div>
    </div>

    <div class="result-actions">
      <button class="btn-retry" onclick="retryQuiz()">🔄 再来一次 Retry</button>
      <a href="index.html" class="btn-home">🏠 返回首页</a>
    </div>
  </div>

</div>

<!-- 选词翻译浮层 -->
<div id="sel-popup" style="display:none;position:fixed;z-index:2000;max-width:280px;background:#12182a;
  border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);font-size:0.9rem;">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
    <span id="sel-word" style="font-weight:700;font-size:1.05rem;color:var(--text)"></span>
    <button id="sel-tts" title="朗读" style="background:rgba(124,109,240,0.15);border:1px solid rgba(124,109,240,0.25);
      color:#a78bfa;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:0.85rem">🔊</button>
    <button id="sel-fav" title="收藏到生词本" style="background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.3);
      color:var(--rose);border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:0.85rem">🤍</button>
  </div>
  <div id="sel-meaning" style="color:var(--text-muted);line-height:1.5;margin-bottom:8px"></div>
  <a id="sel-link" target="_blank" rel="noopener"
     style="color:#a78bfa;text-decoration:none;font-size:0.82rem">在有道查询 ↗</a>
</div>

<script>
const FILES = {
        'Primary': '../data/primary.json',
        'Junior-1': '../data/junior-1.json',
        'Junior-2': '../data/junior-2.json',
        'Junior-3': '../data/junior-3.json',
        'Senior-1': '../data/senior-1.json',
        'Senior-2': '../data/senior-2.json',
        'Senior-3': '../data/senior-3.json',
        'CET-4': '../data/cet4.json',
        'CET-6': '../data/cet6.json',
        'Postgrad': '../data/postgrad.json',
        'TOEFL': '../data/toefl.json',
        'SAT': '../data/sat.json'
      };

let allWords = [];
let quizWords = [];
let questions = [];
let currentQ = 0;
let correctCount = 0;
let wrongAnswers = [];
let timerInterval = null;
let timerSec = 0;
let timerMax = 0;

// CONFIG
let config = {
  grade: 'all',
  types: new Set(['mc-zh', 'mc-en', 'fill']),
  count: 20,
  timer: 0,
};

// ---- 发音：优先有道真人/神经网络音频，失败回退浏览器语音 ----
function youdaoAudio(text) { return 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2'; }
let preferredVoice = null;
function pickVoice() {
  const vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  if (!vs.length) return;
  preferredVoice =
    vs.find(v => /natural|aria|jenny|guy|michelle|google us english/i.test(v.name) && /^en/i.test(v.lang)) ||
    vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
function speakFallback(text) {
  if (!text || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9; if (preferredVoice) u.voice = preferredVoice;
  window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
}
let currentAudio = null;
function playClip(url, fallbackText, rate) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (!url) return speakFallback(fallbackText);
  const a = new Audio(url); a.playbackRate = rate || 0.92; currentAudio = a;
  a.play().catch(() => speakFallback(fallbackText));
}
// 语速设置（全站共用 localStorage，默认 0.6）
const LS_RATE = 'evh_rate';
function getRate() { const v = parseFloat(localStorage.getItem(LS_RATE)); return (v > 0 ? v : 0.6); }
function setRate(v) { localStorage.setItem(LS_RATE, v); }
// 播放某个词的发音（优先该词数据自带的 audio 字段）
function speakWordObj(w) { if (w) playClip(w.audio || youdaoAudio(w.word), w.word, Math.min(getRate() + 0.2, 1)); }
function speakSentence(text) { if (text) playClip(youdaoAudio(text), text, getRate()); }

async function loadAllVocab() {
  const promises = Object.entries(FILES).map(async ([, file]) => {
    try { const r = await fetch(file); if (!r.ok) return []; return await r.json(); }
    catch { return []; }
  });
  allWords = (await Promise.all(promises)).flat();
  buildDict();
}

// ---- 划词翻译（与闪卡同款，收藏写入同一生词本）----
let wordDict = null;
function buildDict() {
  wordDict = new Map();
  for (const w of allWords) {
    const k = (w.word || '').toLowerCase();
    if (k && !wordDict.has(k)) wordDict.set(k, w);
  }
}
function findEntry(word) {
  if (!wordDict) return null;
  const w = word.toLowerCase();
  if (wordDict.has(w)) return wordDict.get(w);
  for (const suf of ['s','es','ed','ing','d','ies']) {
    if (w.endsWith(suf)) {
      let base = w.slice(0, -suf.length);
      if (suf === 'ies') base += 'y';
      if (wordDict.has(base)) return wordDict.get(base);
    }
  }
  return null;
}
function lookupLocal(word) { const e = findEntry(word); return e ? e.meaning : ''; }

// 收藏写入与闪卡共用的 localStorage
let favSet = new Set(JSON.parse(localStorage.getItem('evh_fav') || '[]'));
let favWords = new Set(JSON.parse(localStorage.getItem('evh_fav_words') || '[]'));
function isSelFaved(word) {
  const e = findEntry(word);
  if (e && favSet.has(e.id)) return true;
  return favWords.has(word.toLowerCase());
}
function toggleSelFav(word) {
  const e = findEntry(word);
  if (e) {
    if (favSet.has(e.id)) favSet.delete(e.id); else favSet.add(e.id);
    localStorage.setItem('evh_fav', JSON.stringify([...favSet]));
  } else {
    const k = word.toLowerCase();
    if (favWords.has(k)) favWords.delete(k); else favWords.add(k);
    localStorage.setItem('evh_fav_words', JSON.stringify([...favWords]));
  }
}
function showSelPopup(word, rect) {
  const pop = document.getElementById('sel-popup');
  document.getElementById('sel-word').textContent = word;
  document.getElementById('sel-meaning').textContent = lookupLocal(word) || '本地词库未收录，点下方有道查询';
  document.getElementById('sel-link').href = 'https://www.youdao.com/result?word=' + encodeURIComponent(word) + '&lang=en';
  document.getElementById('sel-tts').onclick = (e) => { e.stopPropagation(); playClip(youdaoAudio(word), word, Math.min(getRate() + 0.2, 1)); };
  const favBtn = document.getElementById('sel-fav');
  favBtn.textContent = isSelFaved(word) ? '❤️' : '🤍';
  favBtn.onclick = (e) => { e.stopPropagation(); toggleSelFav(word); favBtn.textContent = isSelFaved(word) ? '❤️' : '🤍'; };
  pop.style.display = 'block';
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = rect.left + rect.width / 2 - pw / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  let top = rect.top - ph - 10; if (top < 8) top = rect.bottom + 10;
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
function hideSelPopup() { document.getElementById('sel-popup').style.display = 'none'; }
function handleSelection() {
  const sel = window.getSelection();
  const text = (sel ? sel.toString() : '').trim();
  const word = text.replace(/[^a-zA-Z'\-]/g, '');
  if (!word || /\s/.test(text) || word.length < 2) return;
  showSelPopup(word, sel.getRangeAt(0).getBoundingClientRect());
}
// 只在题目区/反馈区选词时触发
document.addEventListener('mouseup', (e) => {
  const card = document.getElementById('question-card');
  const fb = document.getElementById('feedback-box');
  if ((card && card.contains(e.target)) || (fb && fb.contains(e.target))) setTimeout(handleSelection, 0);
});
document.addEventListener('click', (e) => {
  const pop = document.getElementById('sel-popup');
  if (pop.style.display !== 'block') return;
  if (pop.contains(e.target)) return;
  hideSelPopup();
}, true);

loadAllVocab();

// SETUP chip logic
function setupChips(containerId, singleSelect = true) {
  const container = document.getElementById(containerId);
  container.addEventListener('click', e => {
    const chip = e.target.closest('.setup-chip');
    if (!chip) return;
    if (singleSelect) {
      container.querySelectorAll('.setup-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    } else {
      chip.classList.toggle('active');
    }
  });
}

setupChips('grade-chips', true);
setupChips('type-chips', false);
setupChips('timer-chips', true);

// 语速设置初始化
(function initSpeed() {
  const sel = document.getElementById('speed-select');
  if (!sel) return;
  sel.value = String(getRate());
  sel.addEventListener('change', () => setRate(sel.value));
})();

// 读取 URL 的 level 参数，预选对应年级
(function applyLevelParam() {
  const lv = new URLSearchParams(location.search).get('level');
  if (!lv) return;
  const chip = document.querySelector(`#grade-chips .setup-chip[data-val="${lv}"]`);
  if (chip) {
    document.querySelectorAll('#grade-chips .setup-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
  }
})();

const qCountInput = document.getElementById('q-count');
const qCountVal = document.getElementById('q-count-val');
qCountInput.addEventListener('input', () => { qCountVal.textContent = qCountInput.value; });

document.getElementById('start-btn').addEventListener('click', startQuiz);

function startQuiz() {
  // Read config
  const gradeActive = document.querySelector('#grade-chips .setup-chip.active');
  config.grade = gradeActive ? gradeActive.dataset.val : 'all';

  const typeActives = document.querySelectorAll('#type-chips .setup-chip.active');
  config.types = new Set([...typeActives].map(c => c.dataset.val));
  if (config.types.size === 0) config.types = new Set(['mc-zh']);

  config.count = parseInt(qCountInput.value);

  const timerActive = document.querySelector('#timer-chips .setup-chip.active');
  config.timer = timerActive ? parseInt(timerActive.dataset.val) : 0;

  // Filter words
  let pool = allWords;
  if (config.grade !== 'all') pool = pool.filter(w => w.level === config.grade);
  if (pool.length < 4) { alert('词汇量不足，请选择更多年级 / Not enough words, select more grades.'); return; }

  pool = shuffle(pool);
  quizWords = pool.slice(0, config.count);

  // Build questions
  questions = quizWords.map(w => buildQuestion(w, pool));
  currentQ = 0;
  correctCount = 0;
  wrongAnswers = [];

  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('hud-total').textContent = questions.length;
  document.getElementById('hud-score').textContent = 0;

  if (config.timer > 0) document.getElementById('timer-ring').style.display = 'block';
  else document.getElementById('timer-ring').style.display = 'none';

  renderQuestion();
}

function buildQuestion(word, pool) {
  const types = [...config.types];
  const type = types[Math.floor(Math.random() * types.length)];

  if (type === 'fill') {
    return { type: 'fill', word };
  }

  // MC: pick 3 distractors
  const distractors = shuffle(pool.filter(w => w.id !== word.id)).slice(0, 3);
  const options = shuffle([word, ...distractors]);

  if (type === 'mc-zh') {
    // Show English, choose Chinese
    return { type: 'mc-zh', word, options };
  } else {
    // Show Chinese, choose English
    return { type: 'mc-en', word, options };
  }
}

function renderQuestion() {
  const q = questions[currentQ];
  const total = questions.length;

  document.getElementById('hud-fill').style.width = `${((currentQ) / total) * 100}%`;
  document.getElementById('hud-text').textContent = `${currentQ + 1} / ${total}`;

  const fb = document.getElementById('feedback-box');
  fb.style.display = 'none';
  fb.className = 'feedback-box';
  document.getElementById('next-q-btn').style.display = 'none';

  const content = document.getElementById('q-content');
  const badge = document.getElementById('q-type-badge');

  if (q.type === 'mc-zh') {
    badge.textContent = '看英选中 · Choose Chinese';
    content.innerHTML = `
      <div class="q-word-big">${q.word.word}
        <button onclick="speakCurrent()" title="朗读" style="vertical-align:middle;background:rgba(124,109,240,0.15);border:1px solid rgba(124,109,240,0.25);color:#a78bfa;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1rem;margin-left:8px">🔊</button>
      </div>
      <div class="q-phonetic">${q.word.phonetic || ''}</div>
      <div class="q-pos">${q.word.pos || ''}</div>
      <br>
      <div class="options-grid" id="opts">
        ${q.options.map((o,i) => `
          <button class="option-btn" onclick="checkMC(${o.id === q.word.id}, this, ${JSON.stringify(q).replace(/"/g,'&quot;')})">
            <span class="option-label">${'ABCD'[i]}.</span>${o.meaning}
          </button>
        `).join('')}
      </div>
    `;
  } else if (q.type === 'mc-en') {
    badge.textContent = '看中选英 · Choose English';
    content.innerHTML = `
      <div class="q-text" style="font-size:1.3rem">${q.word.meaning}</div>
      <div class="q-pos" style="margin-top:4px">${q.word.pos || ''}</div>
      <br>
      <div class="options-grid" id="opts">
        ${q.options.map((o,i) => `
          <button class="option-btn" onclick="checkMC(${o.id === q.word.id}, this, ${JSON.stringify(q).replace(/"/g,'&quot;')})">
            <span class="option-label">${'ABCD'[i]}.</span>${o.word}
          </button>
        `).join('')}
      </div>
    `;
  } else {
    badge.textContent = '拼写填空 · Spell It';
    content.innerHTML = `
      <div class="q-text">拼写下面这个词 / Spell this word:</div>
      <br>
      <div style="font-size:1.4rem;font-weight:700;margin-bottom:6px">${q.word.meaning}</div>
      <div style="font-size:0.9rem;color:var(--text-muted);font-style:italic;margin-bottom:16px">${q.word.pos || ''}</div>
      <div class="fill-input-wrap">
        <input class="fill-input" id="fill-ans" type="text" placeholder="输入单词 / Type the word..." autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <button class="fill-submit" onclick="checkFill(${JSON.stringify(q).replace(/"/g,'&quot;')})">提交 Submit</button>
    `;
    setTimeout(() => {
      const inp = document.getElementById('fill-ans');
      if (inp) {
        inp.focus();
        inp.addEventListener('keydown', e => { if(e.key==='Enter') checkFill(q); });
      }
    }, 50);
  }

  startTimer();
}

function checkMC(isCorrect, btn, q) {
  clearTimer();
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  if (isCorrect) {
    btn.classList.add('correct');
    correct(q);
  } else {
    btn.classList.add('wrong');
    // Highlight correct
    document.querySelectorAll('.option-btn').forEach(b => {
      const txt = b.textContent.trim().replace(/^[ABCD]\.\s*/,'');
      if (txt === q.word.meaning || txt === q.word.word) b.classList.add('correct');
    });
    wrong(q, btn.textContent.replace(/^[ABCD]\.\s*/,'').trim());
  }
  showNextBtn();
}

function checkFill(q) {
  const inp = document.getElementById('fill-ans');
  if (!inp) return;
  const ans = inp.value.trim().toLowerCase();
  const correct_ans = q.word.word.toLowerCase();
  clearTimer();
  if (ans === correct_ans) {
    inp.classList.add('correct');
    correct(q);
  } else {
    inp.classList.add('wrong');
    inp.disabled = true;
    wrong(q, inp.value.trim());
  }
  document.querySelector('.fill-submit') && (document.querySelector('.fill-submit').disabled = true);
  showNextBtn();
}

function correct(q) {
  correctCount++;
  document.getElementById('hud-score').textContent = correctCount;
  showFeedback(true, `✅ 正确！Correct!`, `${q.word.example || ''} — ${q.word.translation || ''}`);
}

function wrong(q, userAns) {
  wrongAnswers.push({ word: q.word, userAns });
  showFeedback(false, `❌ 正确答案：${q.word.word} (${q.word.meaning})`, q.word.example || '');
}

function speakCurrent() { const q = questions[currentQ]; if (q) speakWordObj(q.word); }
function speakCurrentSentence() { const q = questions[currentQ]; if (q && q.word.example) speakSentence(q.word.example); }

function showFeedback(isCorrect, title, detail) {
  const fb = document.getElementById('feedback-box');
  fb.style.display = 'block';
  fb.className = 'feedback-box ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  const q = questions[currentQ];
  const sBtn = `<button onclick="speakCurrent()" title="朗读单词" style="background:rgba(124,109,240,0.15);border:1px solid rgba(124,109,240,0.25);color:#a78bfa;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:0.8rem;margin-left:8px">🔊</button>`;
  document.getElementById('fb-title').innerHTML = title + sBtn;
  const exBtn = (q && q.word.example) ? ` <button onclick="speakCurrentSentence()" title="朗读例句" style="background:none;border:none;cursor:pointer;font-size:1rem;color:inherit;opacity:0.8">🔊</button>` : '';
  document.getElementById('fb-example').innerHTML = (detail || '') + exBtn;
}

function showNextBtn() {
  document.getElementById('next-q-btn').style.display = 'block';
  document.getElementById('next-q-btn').textContent = currentQ < questions.length - 1 ? '下一题 Next →' : '查看结果 Results →';
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) { showResults(); return; }
  renderQuestion();
}

// TIMER
function startTimer() {
  clearTimer();
  if (config.timer <= 0) return;
  timerMax = config.timer;
  timerSec = timerMax;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timerSec--;
    updateTimerUI();
    if (timerSec <= 0) {
      clearTimer();
      // Time up — mark wrong
      const q = questions[currentQ];
      document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      const fillSub = document.querySelector('.fill-submit');
      if (fillSub) fillSub.disabled = true;
      wrong(q, '(时间到 Time up)');
      showNextBtn();
    }
  }, 1000);
}

function clearTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function updateTimerUI() {
  const circ = 119.4;
  const pct = timerSec / timerMax;
  document.getElementById('timer-arc').style.strokeDashoffset = circ * (1 - pct);
  document.getElementById('timer-text').textContent = timerSec;
  const arc = document.getElementById('timer-arc');
  if (timerSec <= 5) arc.style.stroke = 'var(--rose)';
  else if (timerSec <= 10) arc.style.stroke = 'var(--amber)';
  else arc.style.stroke = 'var(--purple)';
}

// RESULTS
function showResults() {
  clearTimer();
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  const total = questions.length;
  const pct = Math.round((correctCount / total) * 100);

  document.getElementById('result-grade').textContent = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 50 ? '😊' : '😅';
  document.getElementById('result-title').textContent = pct >= 90 ? '太棒了！Excellent!' : pct >= 70 ? '做得好！Well Done!' : pct >= 50 ? '继续加油！Keep Going!' : '需要多练练！Practice More!';
  document.getElementById('result-pct').textContent = pct + '%';
  document.getElementById('score-ring').style.setProperty('--pct', `${pct * 3.6}deg`);
  document.getElementById('r-correct').textContent = correctCount;
  document.getElementById('r-wrong').textContent = total - correctCount;
  document.getElementById('r-total').textContent = total;

  if (wrongAnswers.length > 0) {
    const wl = document.getElementById('wrong-list');
    wl.style.display = 'block';
    document.getElementById('wrong-items').innerHTML = wrongAnswers.map(wa => `
      <div class="wrong-item">
        <span class="wrong-word">${wa.word.word}</span>
        <span style="color:var(--text-muted)">→</span>
        <span class="wrong-right">${wa.word.meaning}</span>
        <span style="color:var(--text-muted);margin-left:auto;font-size:0.78rem">你答了：${wa.userAns}</span>
      </div>
    `).join('');
  }
}

function retryQuiz() {
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'block';
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
</script>
</body>
</html>
