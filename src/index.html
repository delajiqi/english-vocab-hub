<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocab Hub - 英语单词学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, '微软雅黑';
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.3s;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .search-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-results {
            margin-top: 20px;
        }

        .result-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .word {
            font-weight: bold;
            font-size: 1.2em;
            color: #333;
        }

        .phonetic {
            color: #999;
            font-style: italic;
        }

        .meaning {
            color: #666;
            margin-top: 5px;
        }

        .example {
            color: #888;
            margin-top: 8px;
            font-size: 0.95em;
            border-top: 1px solid #ddd;
            padding-top: 8px;
        }

        .level-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            margin-top: 8px;
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 English Vocab Hub</h1>
            <p class="subtitle">系统学习初高中英语单词</p>
        </header>

        <div class="search-section">
            <h2>🔍 搜索单词</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="输入单词或中文意思...">
                <button class="btn" onclick="searchWord()">搜索</button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <div class="main-content">
            <div class="card" onclick="location.href='flashcard.html'">
                <div class="card-icon">🎴</div>
                <h2>闪卡学习</h2>
                <p>使用闪卡模式逐个学习单词，包括音标、例句和中文释义。</p>
                <button class="btn">进入闪卡</button>
            </div>

            <div class="card" onclick="location.href='quiz.html'">
                <div class="card-icon">✏️</div>
                <h2>测试评估</h2>
                <p>通过各种题型（选择题、填空、拼写）检验学习成果。</p>
                <button class="btn">开始测试</button>
            </div>

            <div class="card" onclick="location.href='search.html'">
                <div class="card-icon">🔎</div>
                <h2>全面搜索</h2>
                <p>按等级、分类、词性等条件精准查找单词。</p>
                <button class="btn">高级搜索</button>
            </div>
        </div>

        <footer>
            <p>&copy; 2024 English Vocab Hub - 帮助学生系统学习英语单词</p>
            <p>数据来源：中国教育部英语课程标准 | <a href="#" style="color: white;">GitHub</a></p>
        </footer>
    </div>

    <script>
        // 加载词汇数据
        let vocabData = [];

        async function loadVocabData() {
            try {
                const response = await fetch('../data/vocab.json');
                vocabData = await response.json();
            } catch (error) {
                console.log('注：此为离线演示版本，搜索功能演示相关数据。');
                // 演示数据
                vocabData = [
                    { id: 1, word: "house", phonetic: "[haʊs]", pos: "n.", meaning: "房子；住宅", example: "I live in a small house near the school.", translation: "我住在学校附近的一所小房子里。", level: "Junior-1" },
                    { id: 2, word: "school", phonetic: "[skuːl]", pos: "n.", meaning: "学校", example: "My school is very beautiful.", translation: "我的学校很漂亮。", level: "Junior-1" },
                    { id: 3, word: "teacher", phonetic: "[ˈtiːtʃə(r)]", pos: "n.", meaning: "老师；教师", example: "My English teacher is very kind.", translation: "我的英语老师很善良。", level: "Junior-1" }
                ];
            }
        }

        function searchWord() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';

            if (!query) {
                resultsDiv.innerHTML = '<p style="color: #999;">请输入搜索内容</p>';
                return;
            }

            const results = vocabData.filter(item => 
                item.word.toLowerCase().includes(query) || 
                item.meaning.toLowerCase().includes(query) ||
                item.translation.toLowerCase().includes(query)
            );

            if (results.length === 0) {
                resultsDiv.innerHTML = '<p style="color: #999;">未找到相关单词</p>';
                return;
            }

            results.forEach(item => {
                const resultHTML = `
                    <div class="result-item">
                        <div class="word">${item.word}</div>
                        <div class="phonetic">${item.phonetic} | ${item.pos}</div>
                        <div class="meaning">${item.meaning}</div>
                        <div class="example">例句：${item.example}</div>
                        <div class="example" style="border: none; padding: 0; margin-top: 5px;">${item.translation}</div>
                        <span class="level-badge">${item.level}</span>
                    </div>
                `;
                resultsDiv.innerHTML += resultHTML;
            });
        }

        // 回车搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchWord();
        });

        // 页面加载时获取数据
        loadVocabData();
    </script>
</body>
</html>
