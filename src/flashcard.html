<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闪卡学习 Flashcards | English Vocab Hub</title>
  <meta name="description" content="闪卡模式学习英语词汇，支持3D翻转、TTS朗读、收藏功能">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: rgba(255,255,255,0.05);
      --surface-hover: rgba(255,255,255,0.09);
      --border: rgba(255,255,255,0.10);
      --text: #e8eaf0;
      --text-muted: #8892a4;
      --purple: #7c6df0;
      --blue: #4f9cf9;
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #f87171;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 30%, rgba(124,109,240,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 70%, rgba(79,156,249,0.10) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(10,14,26,0.9);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; font-weight: 700; font-size: 0.95rem; }
    .nav-logo-icon { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg,#7c6df0,#4f9cf9); display:flex;align-items:center;justify-content:center;font-size:0.9rem; }
    .nav-links { display: flex; gap: 6px; }
    .nav-link { padding:7px 14px;border-radius:8px;color:var(--text-muted);text-decoration:none;font-size:0.85rem;font-weight:500;transition:all 0.2s;border:1px solid transparent; }
    .nav-link:hover { color:var(--text);background:var(--surface); }
    .nav-link.active { color:#a78bfa;background:rgba(124,109,240,0.12);border-color:rgba(124,109,240,0.3); }

    /* MAIN LAYOUT */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 24px 40px;
      position: relative;
      z-index: 1;
    }

    /* CONTROLS */
    .controls-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .ctrl-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .ctrl-select:focus { border-color: var(--purple); }

    .ctrl-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-btn:hover { background: var(--surface-hover); color: var(--text); }
    .ctrl-btn.active { background: rgba(124,109,240,0.15); border-color: rgba(124,109,240,0.4); color: #a78bfa; }

    .spacer { flex: 1; }

    /* PROGRESS */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c6df0, #4f9cf9);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .progress-text { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; font-weight: 500; }

    /* FLASHCARD */
    .card-scene {
      perspective: 1200px;
      margin-bottom: 28px;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .card-3d {
      width: 100%;
      min-height: 380px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .card-3d.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 36px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .card-front {
      background: linear-gradient(145deg, #111827, #1a2035);
    }

    .card-back {
      background: linear-gradient(145deg, #0f1d30, #141e35);
      transform: rotateY(180deg);
    }

    .card-hint {
      position: absolute;
      top: 18px;
      right: 20px;
      font-size: 0.72rem;
      color: var(--text-muted);
      opacity: 0.6;
    }

    .card-level-badge {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 100px;
      background: rgba(124,109,240,0.2);
      color: #a78bfa;
      font-weight: 600;
    }

    .card-cat-badge {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 100px;
      background: rgba(79,156,249,0.2);
      color: var(--blue);
      font-weight: 600;
    }

    .card-word {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      color: var(--text);
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .card-phonetic {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-style: italic;
      letter-spacing: 0.5px;
    }

    .card-pos {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(124,109,240,0.15);
      border: 1px solid rgba(124,109,240,0.25);
      border-radius: 6px;
      font-size: 0.78rem;
      color: #a78bfa;
      font-weight: 600;
      margin-bottom: 28px;
    }

    .tts-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(124,109,240,0.15);
      border: 1px solid rgba(124,109,240,0.25);
      color: #a78bfa;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items:center; justify-content:center;
    }

    .tts-btn:hover { background: rgba(124,109,240,0.3); transform: scale(1.05); }

    /* Back face */
    .card-meaning {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 20px;
    }

    .card-example {
      background: rgba(255,255,255,0.05);
      border-left: 3px solid var(--purple);
      border-radius: 0 10px 10px 0;
      padding: 14px 16px;
      width: 100%;
      margin-top: 8px;
    }

    .card-example-en {
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 6px;
      font-style: italic;
      line-height: 1.5;
    }

    .card-example-zh {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* ACTION BUTTONS */
    .action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover { background: var(--surface-hover); color: var(--text); }

    .btn-prev, .btn-next {
      padding: 10px 24px;
    }

    .btn-next {
      background: linear-gradient(135deg, rgba(124,109,240,0.2), rgba(79,156,249,0.2));
      border-color: rgba(124,109,240,0.3);
      color: #a78bfa;
    }

    .btn-next:hover { background: linear-gradient(135deg, rgba(124,109,240,0.35), rgba(79,156,249,0.35)); }

    .btn-fav.faved { color: var(--rose); border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.1); }

    .btn-know {
      background: rgba(52,211,153,0.1);
      border-color: rgba(52,211,153,0.3);
      color: var(--emerald);
    }

    .btn-know:hover { background: rgba(52,211,153,0.25); }

    /* STATS BAR */
    .stats-bar {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.82rem;
    }

    .stat-chip-val { font-weight: 700; font-size: 1rem; }
    .sc-known .stat-chip-val { color: var(--emerald); }
    .sc-fav .stat-chip-val { color: var(--rose); }
    .sc-total .stat-chip-val { color: #a78bfa; }

    /* EMPTY / LOADING */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state h2 { font-size: 1.4rem; margin-bottom: 8px; color: var(--text); }

    /* Keyboard hint */
    .keyboard-hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 16px;
      opacity: 0.6;
    }

    .kbd {
      display: inline-block;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.7rem;
      font-family: monospace;
    }

    /* Flip animation glow */
    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 20px rgba(124,109,240,0.2); }
      50% { box-shadow: 0 0 40px rgba(124,109,240,0.4); }
    }

    .card-3d.flipped .card-back {
      animation: glowPulse 2s ease infinite;
    }

    /* Swipe indicator */
    .swipe-hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">📚</div>
    English Vocab Hub
  </a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">首页 Home</a>
    <a href="flashcard.html" class="nav-link active">闪卡 Flashcards</a>
    <a href="quiz.html" class="nav-link">测验 Quiz</a>
  </div>
</nav>

<div class="main">
  <!-- Controls -->
  <div class="controls-bar">
    <select class="ctrl-select" id="level-select">
      <option value="all">全部年级 All Grades</option>
      <option value="Junior">初中大纲 Junior</option>
          <option value="Senior">高中高考 Senior</option>
          <option value="CET-4">大学四级 CET-4</option>
          <option value="CET-6">大学六级 CET-6</option>
          <option value="Postgrad">考研 Postgrad</option>
          <option value="TOEFL">托福 TOEFL</option>
          <option value="SAT">SAT</option>
    </select>
    <select class="ctrl-select" id="cat-select">
      <option value="all">全部分类 All</option>
      <option value="noun">名词 Noun</option>
      <option value="verb">动词 Verb</option>
      <option value="action">动词 Action</option>
      <option value="adjective">形容词 Adj</option>
      <option value="description">描述 Description</option>
      <option value="adverb">副词 Adv</option>
      <option value="academic">学术 Academic</option>
      <option value="phrase">短语 Phrase</option>
    </select>
    <div class="spacer"></div>
    <button class="ctrl-btn" id="btn-shuffle">🔀 随机 Shuffle</button>
    <button class="ctrl-btn" id="btn-fav-only">❤️ 生词本</button>
    <button class="ctrl-btn" id="btn-unknown-only">📌 待掌握</button>
  </div>

  <!-- Progress -->
  <div class="progress-row">
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="progress-text" id="progress-text">0 / 0</span>
  </div>

  <!-- Card -->
  <div class="card-scene" id="card-scene">
    <div class="card-3d" id="card" onclick="flipCard()">
      <!-- Front -->
      <div class="card-face card-front">
        <span class="card-hint">点击翻转 · Click to flip</span>
        <span class="card-level-badge" id="front-level">—</span>
        <div class="card-word" id="front-word">Loading...</div>
        <div class="card-phonetic" id="front-phonetic"></div>
        <span class="card-pos" id="front-pos"></span>
        <button class="tts-btn" id="tts-btn" onclick="event.stopPropagation();speakWord()" title="朗读 Pronounce">🔊</button>
      </div>
      <!-- Back -->
      <div class="card-face card-back">
        <span class="card-hint">再次点击返回 · Click to flip back</span>
        <span class="card-cat-badge" id="back-cat">—</span>
        <div class="card-meaning" id="back-meaning">—</div>
        <div class="card-example">
          <div class="card-example-en" id="back-example"></div>
          <div class="card-example-zh" id="back-translation"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="action-row">
    <button class="action-btn btn-prev" onclick="prevCard()">← 上一个</button>
    <button class="action-btn btn-fav" id="btn-fav" onclick="toggleFav()">🤍 收藏</button>
    <button class="action-btn btn-know" onclick="markKnown()">✓ 已掌握</button>
    <button class="action-btn btn-next" onclick="nextCard()">下一个 →</button>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-chip sc-total">
      <span>📚 词汇总数</span>
      <span class="stat-chip-val" id="sc-total">0</span>
    </div>
    <div class="stat-chip sc-known">
      <span>✅ 已掌握</span>
      <span class="stat-chip-val" id="sc-known">0</span>
    </div>
    <div class="stat-chip sc-fav">
      <span>❤️ 已收藏</span>
      <span class="stat-chip-val" id="sc-fav">0</span>
    </div>
  </div>

  <div class="keyboard-hint">
    <kbd class="kbd">Space</kbd> 翻转 &nbsp;
    <kbd class="kbd">←</kbd> 上一个 &nbsp;
    <kbd class="kbd">→</kbd> 下一个 &nbsp;
    <kbd class="kbd">F</kbd> 收藏 &nbsp;
    <kbd class="kbd">K</kbd> 已掌握
  </div>
</div>

<script>
const FILES = {
        'Junior': '../data/junior.json',
        'Senior': '../data/senior.json',
        'CET-4': '../data/cet4.json',
        'CET-6': '../data/cet6.json',
        'Postgrad': '../data/postgrad.json',
        'TOEFL': '../data/toefl.json',
        'SAT': '../data/sat.json'
      };

let allWords = [];
let deck = [];
let currentIdx = 0;
let isFlipped = false;
let favMode = false;
let unknownMode = false;

const LS_KNOWN = 'evh_known';
const LS_FAV = 'evh_fav';

let knownSet = new Set(JSON.parse(localStorage.getItem(LS_KNOWN) || '[]'));
let favSet = new Set(JSON.parse(localStorage.getItem(LS_FAV) || '[]'));

function saveKnown() { localStorage.setItem(LS_KNOWN, JSON.stringify([...knownSet])); }
function saveFav() { localStorage.setItem(LS_FAV, JSON.stringify([...favSet])); }

async function loadAllVocab() {
  const promises = Object.entries(FILES).map(async ([, file]) => {
    try {
      const res = await fetch(file);
      if (!res.ok) return [];
      return await res.json();
    } catch { return []; }
  });
  const results = await Promise.all(promises);
  allWords = results.flat();
  applyFilters();

  // Read URL param
  const params = new URLSearchParams(window.location.search);
  const lvParam = params.get('level');
  if (lvParam) {
    document.getElementById('level-select').value = lvParam;
    applyFilters();
  }
}

function applyFilters() {
  const level = document.getElementById('level-select').value;
  const cat = document.getElementById('cat-select').value;

  let filtered = allWords;
  if (level !== 'all') filtered = filtered.filter(w => w.level === level);
  if (cat !== 'all') filtered = filtered.filter(w => w.category === cat);
  if (favMode) filtered = filtered.filter(w => favSet.has(w.id));
  if (unknownMode) filtered = filtered.filter(w => !knownSet.has(w.id));

  deck = filtered;
  currentIdx = 0;
  renderCard();
}

function renderCard() {
  // Un-flip
  const card = document.getElementById('card');
  if (isFlipped) { card.classList.remove('flipped'); isFlipped = false; }

  const total = deck.length;
  const idx = currentIdx;

  document.getElementById('progress-fill').style.width = total ? `${((idx+1)/total)*100}%` : '0%';
  document.getElementById('progress-text').textContent = total ? `${idx+1} / ${total}` : '0 / 0';
  document.getElementById('sc-total').textContent = deck.length;
  document.getElementById('sc-known').textContent = knownSet.size;
  document.getElementById('sc-fav').textContent = favSet.size;

  if (!total) {
    document.getElementById('front-word').textContent = 'No words';
    document.getElementById('front-phonetic').textContent = '';
    document.getElementById('front-pos').textContent = '';
    document.getElementById('front-level').textContent = '';
    document.getElementById('back-meaning').textContent = '—';
    document.getElementById('back-example').textContent = '';
    document.getElementById('back-translation').textContent = '';
    return;
  }

  const w = deck[idx];
  document.getElementById('front-word').textContent = w.word;
  document.getElementById('front-phonetic').textContent = w.phonetic || '';
  document.getElementById('front-pos').textContent = w.pos || '';
  document.getElementById('front-level').textContent = w.level || '';
  document.getElementById('back-cat').textContent = w.category || '';
  document.getElementById('back-meaning').textContent = w.meaning || '';
  document.getElementById('back-example').textContent = w.example || '';
  document.getElementById('back-translation').textContent = w.translation || '';

  // Fav button
  const favBtn = document.getElementById('btn-fav');
  if (favSet.has(w.id)) {
    favBtn.textContent = '❤️ 已收藏';
    favBtn.classList.add('faved');
  } else {
    favBtn.textContent = '🤍 收藏';
    favBtn.classList.remove('faved');
  }
}

function flipCard() {
  if (!deck.length) return;
  isFlipped = !isFlipped;
  document.getElementById('card').classList.toggle('flipped', isFlipped);
}

function nextCard() {
  if (!deck.length) return;
  currentIdx = (currentIdx + 1) % deck.length;
  renderCard();
}

function prevCard() {
  if (!deck.length) return;
  currentIdx = (currentIdx - 1 + deck.length) % deck.length;
  renderCard();
}

function toggleFav() {
  if (!deck.length) return;
  const w = deck[currentIdx];
  if (favSet.has(w.id)) { favSet.delete(w.id); } else { favSet.add(w.id); }
  saveFav();
  renderCard();
}

function markKnown() {
  if (!deck.length) return;
  const w = deck[currentIdx];
  knownSet.add(w.id);
  saveKnown();
  document.getElementById('sc-known').textContent = knownSet.size;
  // Visual feedback
  const card = document.getElementById('card');
  card.style.transition = 'transform 0.3s, opacity 0.3s';
  card.style.transform = 'translateX(40px)';
  card.style.opacity = '0.5';
  setTimeout(() => {
    card.style.transform = '';
    card.style.opacity = '';
    nextCard();
  }, 280);
}

function speakWord() {
  if (!deck.length) return;
  const w = deck[currentIdx];
  const utt = new SpeechSynthesisUtterance(w.word);
  utt.lang = 'en-US';
  utt.rate = 0.85;
  window.speechSynthesis.speak(utt);
}

// Shuffle
document.getElementById('btn-shuffle').addEventListener('click', () => {
  deck = [...deck].sort(() => Math.random() - 0.5);
  currentIdx = 0;
  renderCard();
});

// Fav-only mode
document.getElementById('btn-fav-only').addEventListener('click', (e) => {
  favMode = !favMode;
  unknownMode = false;
  e.currentTarget.classList.toggle('active', favMode);
  document.getElementById('btn-unknown-only').classList.remove('active');
  applyFilters();
});

// Unknown-only mode
document.getElementById('btn-unknown-only').addEventListener('click', (e) => {
  unknownMode = !unknownMode;
  favMode = false;
  e.currentTarget.classList.toggle('active', unknownMode);
  document.getElementById('btn-fav-only').classList.remove('active');
  applyFilters();
});

// Filters change
document.getElementById('level-select').addEventListener('change', applyFilters);
document.getElementById('cat-select').addEventListener('change', applyFilters);

// Keyboard
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  if (e.code === 'ArrowRight') nextCard();
  if (e.code === 'ArrowLeft') prevCard();
  if (e.key.toLowerCase() === 'f') toggleFav();
  if (e.key.toLowerCase() === 'k') markKnown();
});

// Touch swipe support
let touchStartX = 0;
document.getElementById('card-scene').addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].clientX;
}, { passive: true });
document.getElementById('card-scene').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) { dx > 0 ? prevCard() : nextCard(); }
}, { passive: true });

loadAllVocab();
</script>
