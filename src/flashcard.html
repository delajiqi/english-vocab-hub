<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闪卡学习 Flashcards | English Vocab Hub</title>
  <meta name="description" content="闪卡模式学习英语词汇，支持3D翻转、TTS朗读、收藏功能">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: rgba(255,255,255,0.05);
      --surface-hover: rgba(255,255,255,0.09);
      --border: rgba(255,255,255,0.10);
      --text: #e8eaf0;
      --text-muted: #8892a4;
      --purple: #7c6df0;
      --blue: #4f9cf9;
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #f87171;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 30%, rgba(124,109,240,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 70%, rgba(79,156,249,0.10) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(10,14,26,0.9);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; font-weight: 700; font-size: 0.95rem; }
    .nav-logo-icon { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg,#7c6df0,#4f9cf9); display:flex;align-items:center;justify-content:center;font-size:0.9rem; }
    .nav-links { display: flex; gap: 6px; }
    .nav-link { padding:7px 14px;border-radius:8px;color:var(--text-muted);text-decoration:none;font-size:0.85rem;font-weight:500;transition:all 0.2s;border:1px solid transparent; }
    .nav-link:hover { color:var(--text);background:var(--surface); }
    .nav-link.active { color:#a78bfa;background:rgba(124,109,240,0.12);border-color:rgba(124,109,240,0.3); }

    /* MAIN LAYOUT */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 24px 40px;
      position: relative;
      z-index: 1;
    }

    /* CONTROLS */
    .controls-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .ctrl-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .ctrl-select:focus { border-color: var(--purple); }
    .ctrl-select option { background-color: var(--bg); color: var(--text); }

    .ctrl-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-btn:hover { background: var(--surface-hover); color: var(--text); }
    .ctrl-btn.active { background: rgba(124,109,240,0.15); border-color: rgba(124,109,240,0.4); color: #a78bfa; }

    .spacer { flex: 1; }

    /* PROGRESS */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c6df0, #4f9cf9);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .progress-text { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; font-weight: 500; }

    /* FLASHCARD */
    .card-scene {
      perspective: 1200px;
      margin-bottom: 28px;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .card-3d {
      width: 100%;
      min-height: 380px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .card-3d.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 36px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .card-front {
      background: linear-gradient(145deg, #111827, #1a2035);
    }

    .card-back {
      background: linear-gradient(145deg, #0f1d30, #141e35);
      transform: rotateY(180deg);
    }

    .card-hint {
      position: absolute;
      top: 18px;
      right: 20px;
      font-size: 0.72rem;
      color: var(--text-muted);
      opacity: 0.6;
    }

    .card-level-badge {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 100px;
      background: rgba(124,109,240,0.2);
      color: #a78bfa;
      font-weight: 600;
    }

    .card-cat-badge {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 100px;
      background: rgba(79,156,249,0.2);
      color: var(--blue);
      font-weight: 600;
    }

    .card-word {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      color: var(--text);
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .card-phonetic {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-style: italic;
      letter-spacing: 0.5px;
    }

    .card-pos {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(124,109,240,0.15);
      border: 1px solid rgba(124,109,240,0.25);
      border-radius: 6px;
      font-size: 0.78rem;
      color: #a78bfa;
      font-weight: 600;
      margin-bottom: 28px;
    }

    .tts-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(124,109,240,0.15);
      border: 1px solid rgba(124,109,240,0.25);
      color: #a78bfa;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items:center; justify-content:center;
    }

    .tts-btn:hover { background: rgba(124,109,240,0.3); transform: scale(1.05); }

    /* Back face */
    .card-meaning {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 20px;
    }

    .card-example {
      background: rgba(255,255,255,0.05);
      border-left: 3px solid var(--purple);
      border-radius: 0 10px 10px 0;
      padding: 14px 16px;
      width: 100%;
      margin-top: 8px;
    }

    .card-example-en {
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 6px;
      font-style: italic;
      line-height: 1.5;
    }

    .card-example-zh {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* ACTION BUTTONS */
    .action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover { background: var(--surface-hover); color: var(--text); }

    .btn-prev, .btn-next {
      padding: 10px 24px;
    }

    .btn-next {
      background: linear-gradient(135deg, rgba(124,109,240,0.2), rgba(79,156,249,0.2));
      border-color: rgba(124,109,240,0.3);
      color: #a78bfa;
    }

    .btn-next:hover { background: linear-gradient(135deg, rgba(124,109,240,0.35), rgba(79,156,249,0.35)); }

    .btn-fav.faved { color: var(--rose); border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.1); }

    .btn-know {
      background: rgba(52,211,153,0.1);
      border-color: rgba(52,211,153,0.3);
      color: var(--emerald);
    }

    .btn-know:hover { background: rgba(52,211,153,0.25); }

    /* STATS BAR */
    .stats-bar {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.82rem;
    }

    .stat-chip-val { font-weight: 700; font-size: 1rem; }
    .sc-known .stat-chip-val { color: var(--emerald); }
    .sc-fav .stat-chip-val { color: var(--rose); }
    .sc-total .stat-chip-val { color: #a78bfa; }

    /* EMPTY / LOADING */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state h2 { font-size: 1.4rem; margin-bottom: 8px; color: var(--text); }

    /* Keyboard hint */
    .keyboard-hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 16px;
      opacity: 0.6;
    }

    .kbd {
      display: inline-block;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.7rem;
      font-family: monospace;
    }

    /* Flip animation glow */
    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 20px rgba(124,109,240,0.2); }
      50% { box-shadow: 0 0 40px rgba(124,109,240,0.4); }
    }

    .card-3d.flipped .card-back {
      animation: glowPulse 2s ease infinite;
    }

    /* Swipe indicator */
    .swipe-hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">📚</div>
    English Vocab Hub
  </a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">首页 Home</a>
    <a href="flashcard.html" class="nav-link active">闪卡 Flashcards</a>
    <a href="quiz.html" class="nav-link">测验 Quiz</a>
    <a href="plan.html" class="nav-link">计划 Plan</a>
    <a href="wordbook.html" class="nav-link">生词本</a>
  </div>
</nav>

<div class="main">
  <!-- Controls -->
  <div class="controls-bar">
    <select class="ctrl-select" id="level-select">
      <option value="all">全部年级 All Grades</option>
      <option value="Primary">小学大纲 Primary</option>
      <option value="Junior-1">初一年级 Junior-1</option>
      <option value="Junior-2">初二年级 Junior-2</option>
      <option value="Junior-3">初三年级 Junior-3</option>
      <option value="Senior-1">高一年级 Senior-1</option>
      <option value="Senior-2">高二年级 Senior-2</option>
      <option value="Senior-3">高三年级 Senior-3</option>
      <option value="CET-4">大学四级 CET-4</option>
      <option value="CET-6">大学六级 CET-6</option>
      <option value="Postgrad">考研 Postgrad</option>
      <option value="TOEFL">托福 TOEFL</option>
      <option value="SAT">SAT</option>
    </select>
    <select class="ctrl-select" id="cat-select">
      <option value="all">全部词性 All POS</option>
      <option value="n">名词 n.</option>
      <option value="v">动词 v.</option>
      <option value="adj">形容词 adj.</option>
      <option value="adv">副词 adv.</option>
      <option value="prep">介词 prep.</option>
      <option value="conj">连词 conj.</option>
      <option value="pron">代词 pron.</option>
      <option value="num">数词 num.</option>
    </select>
    <div class="spacer"></div>
    <select class="ctrl-select" id="speed-select" title="朗读语速">
      <option value="0.5">🔈 0.5x</option>
      <option value="0.6">🔈 0.6x</option>
      <option value="0.75">🔈 0.75x</option>
      <option value="0.9">🔈 0.9x</option>
      <option value="1">🔈 1.0x</option>
    </select>
    <button class="ctrl-btn" id="btn-shuffle">🔀 随机 Shuffle</button>
    <button class="ctrl-btn" id="btn-fav-only">❤️ 生词本</button>
    <button class="ctrl-btn" id="btn-unknown-only">📌 待掌握</button>
  </div>

  <!-- Progress -->
  <div class="progress-row">
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="progress-text" id="progress-text">0 / 0</span>
  </div>

  <!-- Card -->
  <div class="card-scene" id="card-scene">
    <div class="card-3d" id="card" onclick="flipCard()">
      <!-- Front -->
      <div class="card-face card-front">
        <span class="card-hint">点击翻转 · Click to flip</span>
        <span class="card-level-badge" id="front-level">—</span>
        <div class="card-word" id="front-word">Loading...</div>
        <div class="card-phonetic" id="front-phonetic"></div>
        <span class="card-pos" id="front-pos"></span>
        <button class="tts-btn" id="tts-btn" onclick="event.stopPropagation();speakWord()" title="朗读 Pronounce">🔊</button>
      </div>
      <!-- Back -->
      <div class="card-face card-back">
        <span class="card-hint">再次点击返回 · Click to flip back</span>
        <span class="card-cat-badge" id="back-cat">—</span>
        <div class="card-meaning" id="back-meaning">—</div>
        <div class="card-example">
          <div class="card-example-en" id="back-example"></div>
          <div class="card-example-zh" id="back-translation"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="action-row">
    <button class="action-btn btn-prev" onclick="prevCard()">← 上一个</button>
    <button class="action-btn btn-fav" id="btn-fav" onclick="toggleFav()">🤍 收藏</button>
    <button class="action-btn btn-know" onclick="markKnown()">✓ 已掌握</button>
    <button class="action-btn btn-next" onclick="nextCard()">下一个 →</button>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-chip sc-total">
      <span>📚 词汇总数</span>
      <span class="stat-chip-val" id="sc-total">0</span>
    </div>
    <div class="stat-chip sc-known">
      <span>✅ 已掌握</span>
      <span class="stat-chip-val" id="sc-known">0</span>
    </div>
    <div class="stat-chip sc-fav">
      <span>❤️ 已收藏</span>
      <span class="stat-chip-val" id="sc-fav">0</span>
    </div>
  </div>

  <div class="keyboard-hint">
    <kbd class="kbd">Space</kbd> 翻转 &nbsp;
    <kbd class="kbd">←</kbd> 上一个 &nbsp;
    <kbd class="kbd">→</kbd> 下一个 &nbsp;
    <kbd class="kbd">F</kbd> 收藏 &nbsp;
    <kbd class="kbd">K</kbd> 已掌握
  </div>
  <div class="keyboard-hint" style="margin-top:4px">💡 选中例句里的单词即可查看翻译与发音</div>
</div>

<!-- 选词翻译浮层 -->
<div id="sel-popup" style="display:none;position:fixed;z-index:2000;max-width:280px;background:#12182a;
  border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);font-size:0.9rem;">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
    <span id="sel-word" style="font-weight:700;font-size:1.05rem;color:var(--text)"></span>
    <button id="sel-tts" title="朗读" style="background:rgba(124,109,240,0.15);border:1px solid rgba(124,109,240,0.25);
      color:#a78bfa;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:0.85rem">🔊</button>
    <button id="sel-fav" title="收藏到生词本" style="background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.3);
      color:var(--rose);border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:0.85rem">🤍</button>
  </div>
  <div id="sel-meaning" style="color:var(--text-muted);line-height:1.5;margin-bottom:8px"></div>
  <a id="sel-link" target="_blank" rel="noopener"
     style="color:#a78bfa;text-decoration:none;font-size:0.82rem">在有道查询 ↗</a>
</div>

<script>
const FILES = {
        'Primary': '../data/primary.json',
        'Junior-1': '../data/junior-1.json',
        'Junior-2': '../data/junior-2.json',
        'Junior-3': '../data/junior-3.json',
        'Senior-1': '../data/senior-1.json',
        'Senior-2': '../data/senior-2.json',
        'Senior-3': '../data/senior-3.json',
        'CET-4': '../data/cet4.json',
        'CET-6': '../data/cet6.json',
        'Postgrad': '../data/postgrad.json',
        'TOEFL': '../data/toefl.json',
        'SAT': '../data/sat.json'
      };

let allWords = [];
let deck = [];
let currentIdx = 0;
let isFlipped = false;
let favMode = false;
let unknownMode = false;
let isLoading = true;

const LS_KNOWN = 'evh_known';
const LS_FAV = 'evh_fav';

let knownSet = new Set(JSON.parse(localStorage.getItem(LS_KNOWN) || '[]'));
let favSet = new Set(JSON.parse(localStorage.getItem(LS_FAV) || '[]'));

function saveKnown() { localStorage.setItem(LS_KNOWN, JSON.stringify([...knownSet])); }
function saveFav() { localStorage.setItem(LS_FAV, JSON.stringify([...favSet])); }

async function loadAllVocab() {
  const promises = Object.entries(FILES).map(async ([, file]) => {
    try {
      const res = await fetch(file);
      if (!res.ok) return [];
      return await res.json();
    } catch { return []; }
  });
  const results = await Promise.all(promises);
  allWords = results.flat();
  buildDict();
  isLoading = false;
  applyFilters();

  // Read URL param
  const params = new URLSearchParams(window.location.search);
  const lvParam = params.get('level');
  if (lvParam) {
    document.getElementById('level-select').value = lvParam;
    applyFilters();
  }
  // 从生词本进入：自动开启「生词本」模式
  if (params.get('fav') === '1') {
    favMode = true;
    document.getElementById('btn-fav-only').classList.add('active');
    applyFilters();
  }
}

function applyFilters() {
  const level = document.getElementById('level-select').value;
  const cat = document.getElementById('cat-select').value;

  let filtered = allWords;
  if (level !== 'all') filtered = filtered.filter(w => w.level === level);
  if (cat !== 'all') filtered = filtered.filter(w => w.pos === cat);
  if (favMode) filtered = filtered.filter(w => favSet.has(w.id));
  if (unknownMode) filtered = filtered.filter(w => !knownSet.has(w.id));

  deck = filtered;
  currentIdx = 0;
  renderCard();
}

function renderCard() {
  // Un-flip
  const card = document.getElementById('card');
  if (isFlipped) { card.classList.remove('flipped'); isFlipped = false; }

  const total = deck.length;
  const idx = currentIdx;

  document.getElementById('progress-fill').style.width = total ? `${((idx+1)/total)*100}%` : '0%';
  document.getElementById('progress-text').textContent = total ? `${idx+1} / ${total}` : '0 / 0';
  document.getElementById('sc-total').textContent = deck.length;
  document.getElementById('sc-known').textContent = knownSet.size;
  document.getElementById('sc-fav').textContent = favSet.size;

  if (!total) {
    document.getElementById('front-word').textContent = isLoading ? 'Loading...' : '没有单词 (No words)';
    document.getElementById('front-phonetic').textContent = '';
    document.getElementById('front-pos').textContent = '';
    document.getElementById('front-level').textContent = '';
    document.getElementById('back-meaning').textContent = '—';
    document.getElementById('back-example').innerHTML = '';
    document.getElementById('back-translation').textContent = '';
    return;
  }

  const w = deck[idx];
  document.getElementById('front-word').textContent = w.word;
  document.getElementById('front-phonetic').textContent = w.phonetic || '';
  document.getElementById('front-pos').textContent = w.pos || '';
  document.getElementById('front-level').textContent = w.level || '';
  document.getElementById('back-cat').textContent = w.pos || w.level || '';
  document.getElementById('back-meaning').textContent = w.meaning || '';
  if (w.example) {
    document.getElementById('back-example').innerHTML = `${w.example} <button onclick="playSentence(event)" title="朗读例句" style="background:none;border:none;cursor:pointer;font-size:1.1rem;padding:0 4px;color:inherit;opacity:0.8;">🔊</button>`;
  } else {
    document.getElementById('back-example').innerHTML = '';
  }
  document.getElementById('back-translation').textContent = w.translation || '';

  // Fav button
  const favBtn = document.getElementById('btn-fav');
  if (favSet.has(w.id)) {
    favBtn.textContent = '❤️ 已收藏';
    favBtn.classList.add('faved');
  } else {
    favBtn.textContent = '🤍 收藏';
    favBtn.classList.remove('faved');
  }
}

function flipCard() {
  if (!deck.length) return;
  // 正在选词（划词翻译）时不翻转卡片
  if (window.getSelection && window.getSelection().toString().trim()) return;
  isFlipped = !isFlipped;
  document.getElementById('card').classList.toggle('flipped', isFlipped);
}

// ---- 划词翻译：本地词库即时查中文，含发音、收藏与有道查询 ----
let wordDict = null;      // 小写词 -> 词条对象
function buildDict() {
  wordDict = new Map();
  for (const w of allWords) {
    const k = (w.word || '').toLowerCase();
    if (k && !wordDict.has(k)) wordDict.set(k, w);
  }
}
// 返回词条对象（含轻量词形还原）
function findEntry(word) {
  if (!wordDict) return null;
  const w = word.toLowerCase();
  if (wordDict.has(w)) return wordDict.get(w);
  for (const suf of ['s','es','ed','ing','d','ies']) {
    if (w.endsWith(suf)) {
      let base = w.slice(0, -suf.length);
      if (suf === 'ies') base += 'y';
      if (wordDict.has(base)) return wordDict.get(base);
    }
  }
  return null;
}
function lookupLocal(word) { const e = findEntry(word); return e ? e.meaning : ''; }

// 收藏划到的词：能在词库里找到就按 id 进生词本，找不到则按词存
const LS_FAV_WORDS = 'evh_fav_words';
let favWords = new Set(JSON.parse(localStorage.getItem(LS_FAV_WORDS) || '[]'));
function isSelFaved(word) {
  const e = findEntry(word);
  if (e && favSet.has(e.id)) return true;
  return favWords.has(word.toLowerCase());
}
function toggleSelFav(word) {
  const e = findEntry(word);
  if (e) {
    if (favSet.has(e.id)) favSet.delete(e.id); else favSet.add(e.id);
    saveFav();
  } else {
    const k = word.toLowerCase();
    if (favWords.has(k)) favWords.delete(k); else favWords.add(k);
    localStorage.setItem(LS_FAV_WORDS, JSON.stringify([...favWords]));
  }
  document.getElementById('sc-fav').textContent = favSet.size;
}
function showSelPopup(word, rect) {
  const pop = document.getElementById('sel-popup');
  document.getElementById('sel-word').textContent = word;
  const local = lookupLocal(word);
  document.getElementById('sel-meaning').textContent = local || '本地词库未收录，点下方有道查询';
  document.getElementById('sel-link').href = 'https://www.youdao.com/result?word=' + encodeURIComponent(word) + '&lang=en';
  document.getElementById('sel-tts').onclick = (e) => { e.stopPropagation(); playClip(youdaoAudio(word), word, Math.min(getRate() + 0.2, 1)); };
  const favBtn = document.getElementById('sel-fav');
  favBtn.textContent = isSelFaved(word) ? '❤️' : '🤍';
  favBtn.onclick = (e) => { e.stopPropagation(); toggleSelFav(word); favBtn.textContent = isSelFaved(word) ? '❤️' : '🤍'; };
  pop.style.display = 'block';
  // 定位到选区上方
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = rect.left + rect.width / 2 - pw / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  let top = rect.top - ph - 10;
  if (top < 8) top = rect.bottom + 10;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}
function hideSelPopup() { document.getElementById('sel-popup').style.display = 'none'; }

function handleExampleSelection() {
  const sel = window.getSelection();
  const text = (sel ? sel.toString() : '').trim();
  const word = text.replace(/[^a-zA-Z'\-]/g, '');
  // 只对「单个英文单词」生效
  if (!word || /\s/.test(text) || word.length < 2) { return; }
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  showSelPopup(word, rect);
}

function nextCard() {
  if (!deck.length) return;
  currentIdx = (currentIdx + 1) % deck.length;
  renderCard();
}

function prevCard() {
  if (!deck.length) return;
  currentIdx = (currentIdx - 1 + deck.length) % deck.length;
  renderCard();
}

function toggleFav() {
  if (!deck.length) return;
  const w = deck[currentIdx];
  if (favSet.has(w.id)) { favSet.delete(w.id); } else { favSet.add(w.id); }
  saveFav();
  renderCard();
}

function markKnown() {
  if (!deck.length) return;
  const w = deck[currentIdx];
  knownSet.add(w.id);
  saveKnown();
  document.getElementById('sc-known').textContent = knownSet.size;
  // Visual feedback
  const card = document.getElementById('card');
  card.style.transition = 'transform 0.3s, opacity 0.3s';
  card.style.transform = 'translateX(40px)';
  card.style.opacity = '0.5';
  setTimeout(() => {
    card.style.transform = '';
    card.style.opacity = '';
    nextCard();
  }, 280);
}

// ---- 发音：优先有道真人/神经网络音频，失败再回退浏览器语音 ----
function youdaoAudio(text) {
  // type=2 美音, type=1 英音
  return 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2';
}

// 语速设置（全站共用 localStorage，默认 0.6）
const LS_RATE = 'evh_rate';
function getRate() { const v = parseFloat(localStorage.getItem(LS_RATE)); return (v > 0 ? v : 0.6); }
function setRate(v) { localStorage.setItem(LS_RATE, v); }

// 为「浏览器语音」回退挑一个更自然的嗓音（Win11 的 Natural/Online 语音、Chrome 的 Google 语音等）
let preferredVoice = null;
function pickVoice() {
  const vs = window.speechSynthesis.getVoices();
  if (!vs.length) return;
  preferredVoice =
    vs.find(v => /natural|aria|jenny|guy|michelle|google us english/i.test(v.name) && /^en/i.test(v.lang)) ||
    vs.find(v => /en[-_]US/i.test(v.lang)) ||
    vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

function speakFallback(text) {
  if (!text || !('speechSynthesis' in window)) return;
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-US';
  utt.rate = 0.9;   // 比真人音频更慢一点，听清每个音
  utt.pitch = 1;
  if (preferredVoice) utt.voice = preferredVoice;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utt);
}

let currentAudio = null;
function playClip(url, fallbackText, rate) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (!url) return speakFallback(fallbackText);
  const a = new Audio(url);
  a.playbackRate = rate || 0.92;   // 略放慢，避免太快
  currentAudio = a;
  a.play().catch(() => speakFallback(fallbackText));
}

function speakWord() {
  if (!deck.length) return;
  const w = deck[currentIdx];
  // 单词优先用数据自带的录音(usspeech)，否则按单词请求有道发音
  playClip(w.audio || youdaoAudio(w.word), w.word, Math.min(getRate() + 0.2, 1));
}

function playSentence(e) {
  e.stopPropagation();
  if (!deck.length) return;
  const w = deck[currentIdx];
  if (!w.example) return;
  // 句子用有道在线发音（比浏览器机器音自然），语速可在设置里调整
  playClip(youdaoAudio(w.example), w.example, getRate());
}

// Shuffle
document.getElementById('btn-shuffle').addEventListener('click', (e) => {
  if (deck.length <= 1) return;
  deck = [...deck].sort(() => Math.random() - 0.5);
  currentIdx = 0;
  
  // Visual feedback on button
  const btn = e.currentTarget;
  const origHTML = btn.innerHTML;
  btn.innerHTML = '✨ 已打乱!';
  setTimeout(() => btn.innerHTML = origHTML, 1000);
  
  // Visual feedback on card
  const card = document.getElementById('card');
  card.style.transition = 'transform 0.2s, opacity 0.2s';
  card.style.transform = 'scale(0.95)';
  card.style.opacity = '0';
  setTimeout(() => {
    renderCard();
    card.style.transform = '';
    card.style.opacity = '';
  }, 200);
});

// Fav-only mode
document.getElementById('btn-fav-only').addEventListener('click', (e) => {
  favMode = !favMode;
  unknownMode = false;
  e.currentTarget.classList.toggle('active', favMode);
  document.getElementById('btn-unknown-only').classList.remove('active');
  applyFilters();
});

// Unknown-only mode
document.getElementById('btn-unknown-only').addEventListener('click', (e) => {
  unknownMode = !unknownMode;
  favMode = false;
  e.currentTarget.classList.toggle('active', unknownMode);
  document.getElementById('btn-fav-only').classList.remove('active');
  applyFilters();
});

// Filters change
document.getElementById('level-select').addEventListener('change', applyFilters);
document.getElementById('cat-select').addEventListener('change', applyFilters);

// 语速设置
(function initSpeed() {
  const sel = document.getElementById('speed-select');
  if (!sel) return;
  sel.value = String(getRate());
  sel.addEventListener('change', () => setRate(sel.value));
})();

// Keyboard
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  if (e.code === 'ArrowRight') nextCard();
  if (e.code === 'ArrowLeft') prevCard();
  if (e.key.toLowerCase() === 'f') toggleFav();
  if (e.key.toLowerCase() === 'k') markKnown();
});

// Touch swipe support
let touchStartX = 0;
document.getElementById('card-scene').addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].clientX;
}, { passive: true });
document.getElementById('card-scene').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) { dx > 0 ? prevCard() : nextCard(); }
}, { passive: true });

// 划词翻译：在例句上选词后弹出
const exampleEl = document.getElementById('back-example');
exampleEl.addEventListener('mouseup', (e) => { e.stopPropagation(); setTimeout(handleExampleSelection, 0); });
exampleEl.addEventListener('touchend', (e) => { e.stopPropagation(); setTimeout(handleExampleSelection, 0); });
// 浮层打开时，点击其他地方只关闭浮层，不触发翻牌（捕获阶段拦截）
document.addEventListener('click', (e) => {
  const pop = document.getElementById('sel-popup');
  if (pop.style.display !== 'block') return;
  if (pop.contains(e.target) || exampleEl.contains(e.target)) return;
  hideSelPopup();
  e.stopPropagation();
  e.preventDefault();
}, true);

loadAllVocab();
</script>
